# Standalone SearXNG for local development (no Docker bot).
#
# Usage:
#   docker compose -f docker-compose.searxng.yml up -d
#
# The search API is available at http://localhost:8888.
# Set SEARXNG_URL=http://localhost:8888 in your bot .env when running
# the bot outside Docker.

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    entrypoint: ['/bin/sh', '/usr/local/bin/searxng-entrypoint.sh']
    ports:
      - '8888:8080'
    volumes:
      - ./scripts/searxng-entrypoint.sh:/usr/local/bin/searxng-entrypoint.sh:ro
      - ./searxng:/etc/searxng
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

volumes:
  searxng-data:
    driver: local
