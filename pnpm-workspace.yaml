packages:
  - app
  - desktop
  - mobile
  - integrations/a2a

# Nearest stable versions available from the required Microsoft npm proxy.
overrides:
  hono: 4.13.5
  jose: 6.2.10
  postcss: 8.5.26
  undici@^6.0.0: 6.28.0
  '@open-file-viewer/core>seek-bzip': '-'
  '@open-file-viewer/core>xz-decompress': '-'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: false
  vue-demi: false # Vue 3 is the package default; no compatibility switch script needed.

patchedDependencies:
  '@open-file-viewer/core@0.1.48': patches/@open-file-viewer__core@0.1.48.patch
