name: Shadow release build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'app/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'scripts/**'
      - '*json'
      - '*yaml'
      - '*.ts'
      - '.pnpmfile.cjs'
      - '.github/actions/**'
      - '.github/workflows/release-check.yml'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [desktop, mobile, all]
        default: all
      signed_android:
        description: Build signed Android AAB using mobile-release environment secrets
        type: boolean
        default: false
      signed_ios:
        description: Build App Store signed IPA using mobile-release environment secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

env:
  # Identical source bytes across native checkouts are required by the shared receipt.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  prepare:
    name: Check source and build shared application
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          electron: "false"
      - name: Check selection
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
          SIGNED_ANDROID: ${{ inputs.signed_android || false }}
          SIGNED_IOS: ${{ inputs.signed_ios || false }}
        run: |
          if [ "$BUILD_TARGET" = desktop ] && { [ "$SIGNED_ANDROID" = true ] || [ "$SIGNED_IOS" = true ]; }; then
            echo "::error::Select mobile or all when requesting mobile signing."
            exit 1
          fi
      - name: Typecheck once and build selected shared outputs
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: pnpm release:prepare "$BUILD_TARGET"
      - name: Archive shared outputs with permissions preserved
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: |
          paths=(release-prepared.json)
          if [ "$BUILD_TARGET" != mobile ]; then paths+=(dist desktop/dist app/dist); fi
          if [ "$BUILD_TARGET" != desktop ]; then paths+=(app/dist-mobile); fi
          tar -cf "$RUNNER_TEMP/prepared-build.tar" "${paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-application
          path: ${{ runner.temp }}/prepared-build.tar
          if-no-files-found: error
          retention-days: 3

  windows-release:
    needs: prepare
    if: inputs.target != 'mobile'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aria2/aria2
          ref: 02f2d0d8472b3c38c29b4dba8c75ebd5fdd2899a
          path: .aria2-source
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          packaging: "true"
      - uses: ./.github/actions/restore-prepared
        with:
          target: desktop
      - name: Native Windows release tests
        run: pnpm test:release
      - name: Native process crash and recovery regressions
        run: pnpm exec node --import tsx --test src/execution/processes/guardian_test.ts src/execution/shell-journal_test.ts src/sessions/session-recovery_test.ts
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git autoconf automake libtool make gettext-devel
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-openssl
      - name: Build pinned aria2 for Windows
        shell: msys2 {0}
        run: bash scripts/build-aria2-native.sh .aria2-source desktop/aria2
      - name: Package and verify shared application on Windows
        run: pnpm desktop:package
      - name: Verify packaged application on Windows
        run: pnpm test:packaged
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: shadow-windows-x64
          path: desktop/release/Shadow-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  portable-release:
    needs: prepare
    if: inputs.target != 'mobile'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            arch: arm64
            artifact: shadow-macos-arm64
            pattern: desktop/release/Shadow-*-mac-arm64.zip
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: shadow-macos-x64
            pattern: desktop/release/Shadow-*-mac-x64.zip
          - name: Linux
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: shadow-linux-x64
            pattern: desktop/release/Shadow-*-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aria2/aria2
          ref: 02f2d0d8472b3c38c29b4dba8c75ebd5fdd2899a
          path: .aria2-source
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          packaging: "true"
      - name: Confirm native build target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error('Release requires a native runner matching the target')"
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1
      - uses: ./.github/actions/restore-prepared
        with:
          target: desktop
      - name: Native macOS release tests
        if: runner.os == 'macOS'
        run: pnpm test:release
      - name: Native process crash and recovery regressions
        run: pnpm exec node --import tsx --test src/execution/processes/guardian_test.ts src/execution/shell-journal_test.ts src/sessions/session-recovery_test.ts
      - name: Native Linux release tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:release
      - name: Install macOS aria2 build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Install Linux aria2 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes autoconf automake autopoint libtool pkg-config libssl-dev g++ make
      - name: Build pinned aria2 for this native architecture
        run: bash scripts/build-aria2-native.sh .aria2-source desktop/aria2
      - name: Package and verify shared application on macOS
        if: runner.os == 'macOS'
        run: pnpm desktop:package
      - name: Package and verify shared application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm desktop:package
      - name: Verify packaged application on macOS
        if: runner.os == 'macOS'
        run: pnpm test:packaged
      - name: Verify packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:packaged
      - name: Upload verified portable application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  mobile-release:
    needs: prepare
    if: inputs.target != 'desktop'
    uses: ./.github/workflows/mobile-release.yml
    with:
      signed_android: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_android == true }}
      signed_ios: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_ios == true }}
    secrets: inherit
