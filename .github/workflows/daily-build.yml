name: Shadow daily build

on:
  schedule:
    # 19:17 UTC = 03:17 Asia/Shanghai (avoid the busy top of the hour).
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shadow-daily-build
  cancel-in-progress: false

jobs:
  changes:
    name: Check for commits since the last successful daily build
    # Scheduled runs use the default branch. Manual runs must do the same.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Compare with the last successful daily run
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'daily-build.yml',
              branch: context.payload.repository.default_branch,
              status: 'success',
              per_page: 1,
            });
            const previous = data.workflow_runs[0];
            const build = !previous || previous.head_sha !== context.sha;
            core.setOutput('build', String(build));
            await core.summary
              .addHeading('Daily build')
              .addRaw(build
                ? `Building commit ${context.sha} (no successful daily build for this commit).`
                : `Skipping: commit ${context.sha} already built successfully.`)
              .write();

  desktop:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/release-check.yml
    with:
      target: desktop
      skip_linux: true
