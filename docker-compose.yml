# docker-compose.yml — root of repo
# Dev-mode compose for running the bot agent in a Linux container.
#
# Usage:
#   pnpm dev:docker:compose             (from repo root on Windows)
#   docker compose up --build
#
# Browser viewing (human-in-the-loop):
#   When the bot gets stuck on a browser step (CAPTCHA, 2FA, etc.),
#   open http://localhost:14500 in your Windows browser to see and
#   control Chrome inside the container.
#
# SearXNG search:
#   Available at http://localhost:8888 from Windows.
#   The bot auto-detects it via the "searxng" hostname on the shared network.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional host proxy for builds. Set BOT_HTTP_PROXY / BOT_HTTPS_PROXY
        # in your shell before running compose if direct egress is unavailable.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,searxng}
    container_name: shadow-bot-dev
    depends_on:
      - searxng
    ports:
      - '3123:3123'
      - '9229:9229'
      - '14500:14500'
    env_file:
      - .env
    environment:
      CHROME_PATH: /usr/bin/google-chrome-stable
      SEARXNG_URL: http://searxng:8080
      # Published port 3123 is an explicit remote-development opt-in.
      GATEWAY_HOST: 0.0.0.0
      # DISPLAY is set by docker-entrypoint.sh (xpra :100)
      # Optional host proxy for runtime traffic. If unset, the container runs
      # without a proxy instead of forcing all traffic through a host port.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,searxng}
    shm_size: 1g
    volumes:
      # ── Root workspace config (read-only) ──
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      # ── Bot package (live-reload via --watch) ──
      - ./src:/app/src
      - ./bot.config.json:/app/bot.config.json
      - ./.env:/app/.env:ro
      - ./scripts:/app/scripts
      # ── App (frontend) ──
      - ./app/package.json:/app/app/package.json:ro
      # ── Workspace persistence ──
      - ./workspace:/app/workspace
      # ── Named volumes (persist across restarts) ──
      - bot-root-nm:/app/node_modules
      - app-pkg-nm:/app/app/node_modules
      # ── Host Copilot auth (override with COPILOT_AUTH_DIR if needed) ──
      - ${COPILOT_AUTH_DIR:-${HOME:-${USERPROFILE}}/.config/openclaw/github_copilot}:/home/appuser/.config/openclaw/github_copilot
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    entrypoint: ['/bin/sh', '/usr/local/bin/searxng-entrypoint.sh']
    ports:
      - '8888:8080'
    volumes:
      - ./scripts/searxng-entrypoint.sh:/usr/local/bin/searxng-entrypoint.sh:ro
      - ./searxng:/etc/searxng
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

volumes:
  bot-root-nm:
    driver: local
  app-pkg-nm:
    driver: local
  searxng-data:
    driver: local
