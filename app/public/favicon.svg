<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- abstract shadow shape: layered offset circles fading darker -->
  <circle cx="18" cy="18" r="11" fill="#0f172a" opacity="0.2"/>
  <circle cx="17" cy="17" r="11" fill="#0f172a" opacity="0.35"/>
  <circle cx="16" cy="16" r="11" fill="url(#g)"/>
  <!-- two glowing eyes -->
  <ellipse cx="12.5" cy="15" rx="1.6" ry="1.1" fill="#a78bfa"/>
  <ellipse cx="19.5" cy="15" rx="1.6" ry="1.1" fill="#a78bfa"/>
  <!-- eye glow halos -->
  <circle cx="12.5" cy="15" r="3" fill="url(#glow)"/>
  <circle cx="19.5" cy="15" r="3" fill="url(#glow)"/>
</svg>
