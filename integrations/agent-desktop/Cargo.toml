[package]
name = "shadow-agent-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

# Keep this optional addon independent of the repository's package/lock graph.
[workspace]
exclude = [".upstream", ".upstream/crates/*"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "=2.16.13"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
base64 = "=0.22.1"
image = { version = "=0.25.9", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
agent-desktop-windows = { path = ".upstream/crates/windows" }
agent-desktop-core = { path = ".upstream/crates/core" }

[build-dependencies]
napi-build = "=2.2.3"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
strip = true
